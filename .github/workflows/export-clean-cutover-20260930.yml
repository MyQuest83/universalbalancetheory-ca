name: Export clean cutover snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-clean-cutover-20260930.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrected sanitized public tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build history-free cutover snapshot
        shell: bash
        run: |
          zip -r universalbalancetheory-ca-clean-2026-09-28-post-pr34.zip . \
            -x ".git/*" \
               ".github/workflows/export-clean-cutover-20260930.yml"

      - name: Upload clean cutover snapshot
        uses: actions/upload-artifact@v4
        with:
          name: universalbalancetheory-ca-clean-2026-09-28-post-pr34
          path: universalbalancetheory-ca-clean-2026-09-28-post-pr34.zip
          if-no-files-found: error
          retention-days: 30
