name: One-shot nav and bio polish
on:
  push:
    branches: [qc/nav-bio-polish-2026-08-07]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qc/nav-bio-polish-2026-08-07
          fetch-depth: 0
      - name: Apply narrow polish
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<div class="owner-line">Michael Eric West&rsquo;s</div>'
          new = '<a class="owner-line owner-link" href="michael.html">Michael Eric West&rsquo;s</a>'
          assert text.count(old) == 1, f'owner line match count: {text.count(old)}'
          text = text.replace(old, new)
          owner_css = '.owner-link{text-decoration:none;transition:border-color .18s ease,background .18s ease,color .18s ease,transform .18s ease}.owner-link:hover,.owner-link:focus-visible{color:#fff1c8;border-color:rgba(242,199,106,.5);background:rgba(242,199,106,.09);outline:none;transform:translateY(-1px)}'
          needle = '.owner-line{display:inline-block;margin:0 auto 12px;padding:6px 14px;border:1px solid rgba(242,199,106,.24);border-radius:999px;background:rgba(242,199,106,.055);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(.68rem,1.7vw,.9rem);letter-spacing:.2em;color:#f6d88c;text-shadow:0 0 16px rgba(242,199,106,.3)}'
          assert needle in text, 'owner-line CSS anchor missing'
          text = text.replace(needle, needle + owner_css, 1)
          index.write_text(text, encoding='utf-8')

          styles = Path('styles.css')
          css = styles.read_text(encoding='utf-8')
          marker = '/* 2026-08-07 top-nav polish */'
          assert marker not in css, 'nav polish already present'
          css += '\n' + marker + '''
          .nav{flex-wrap:nowrap;min-height:62px;padding:10px 22px}
          .nav>.brand-mini{flex:0 0 auto}
          .nav>span:last-child{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap;font-size:0;padding:3px 0}
          .nav>span:last-child::-webkit-scrollbar{display:none}
          .nav>span:last-child a{flex:0 0 auto;padding:8px 10px;border:1px solid transparent;border-radius:999px;color:rgba(245,240,232,.76);font-size:.72rem;letter-spacing:.09em;transition:color .18s ease,border-color .18s ease,background .18s ease}
          .nav>span:last-child a:hover,.nav>span:last-child a:focus-visible{color:var(--ink);border-color:rgba(242,199,106,.28);background:rgba(255,255,255,.045);outline:none}
          @media(max-width:760px){.nav{padding:8px 12px;gap:10px;overflow:visible}.nav>span:last-child{gap:4px}.nav>span:last-child a{padding:7px 9px;font-size:.68rem;letter-spacing:.07em}}
          '''
          styles.write_text(css, encoding='utf-8')

          # Static guardrails.
          assert 'href="michael.html">Michael Eric West&rsquo;s</a>' in text
          assert text.count('<h1') == 1
          assert '/* 2026-08-07 top-nav polish */' in css
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/nav-bio-polish.yml
          git config user.name "Michael Eric West"
          git config user.email "mrmikewest83@gmail.com"
          git add index.html styles.css
          git commit -m "Polish top navigation and link title name to bio"
          git push origin HEAD:qc/nav-bio-polish-2026-08-07
