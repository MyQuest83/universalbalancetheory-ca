name: One-shot Luna Prime naming sweep

on:
  push:
    branches:
      - qc/luna-prime-naming-2026-08-07

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qc/luna-prime-naming-2026-08-07
      - name: Replace approved public naming
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'README.md', 'site.js', 'index.html', 'luna.html', 'aria.html',
              'shadow.html', 'links.html', 'michael.html', 'ai-index.html',
              'llms.txt', 'llms-full.txt', 'site-index.json', 'luna-prime.html'
          ]
          old = 'Luna-Prime OS'
          new = 'Luna•Prime•Protocol'
          changed = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(name)
          print('Changed:', ', '.join(changed) or 'none')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/luna-prime-naming-sweep.yml
      - name: Commit sweep
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'QC: standardize public Luna•Prime•Protocol naming'
          git push origin HEAD:qc/luna-prime-naming-2026-08-07
