<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Luna Prime Protocol triad mark</title>
  <desc id="desc">A luminous triangle with blue, green, and red nodes surrounding a gold balance core.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#151c32"/>
      <stop offset="1" stop-color="#050711"/>
    </radialGradient>
    <linearGradient id="triad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#85cfff"/>
      <stop offset=".5" stop-color="#f2c76a"/>
      <stop offset="1" stop-color="#ff626d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="320" cy="320" r="294" fill="url(#bg)" stroke="#f2c76a" stroke-opacity=".28" stroke-width="3"/>
  <circle cx="320" cy="320" r="238" fill="none" stroke="#fff" stroke-opacity=".12" stroke-dasharray="8 14" stroke-width="2"/>
  <path d="M320 104 116 500h408z" fill="#fff" fill-opacity=".025" stroke="url(#triad)" stroke-width="7" filter="url(#glow)"/>
  <circle cx="320" cy="320" r="92" fill="#090d18" stroke="#f2c76a" stroke-width="5" filter="url(#glow)"/>
  <path d="M274 320h92M320 274v92" stroke="#f2c76a" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  <circle cx="320" cy="104" r="25" fill="#85cfff" filter="url(#glow)"/>
  <circle cx="116" cy="500" r="25" fill="#77f2a1" filter="url(#glow)"/>
  <circle cx="524" cy="500" r="25" fill="#ff626d" filter="url(#glow)"/>
  <text x="320" y="313" text-anchor="middle" fill="#f5f0e8" font-family="Georgia, serif" font-size="31" letter-spacing="4">LUNA</text>
  <text x="320" y="351" text-anchor="middle" fill="#f2c76a" font-family="Georgia, serif" font-size="31" letter-spacing="4">PRIME</text>
</svg>
