<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111525"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Luna d20"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Luna Entropic d20 RNG</title><style>html,body{margin:0;min-height:100%;background:#070912;color:#f4f2ff;font-family:system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.moon{font-size:3rem;animation:p 1.2s ease-in-out infinite alternate}.muted{color:#a7acc7}@keyframes p{to{transform:scale(1.08);filter:drop-shadow(0 0 18px #b99cff)}}@media(prefers-reduced-motion:reduce){.moon{animation:none}}</style></head><body><main class="boot"><div><div class="moon">🌙🎲</div><h1>Awakening Luna d20…</h1><p class="muted" id="status">Loading the local-first entropic generator.</p></div></main><script>
(async()=>{const status=document.getElementById('status');try{const files=['app-01.b64','app-02.b64','app-03.b64','app-04.b64','app-05.b64','app-06.b64','app-07.b64'];const parts=await Promise.all(files.map(name=>fetch(name,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(name+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html;if('DecompressionStream'in self){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}else{status.textContent='Loading compatibility decoder…';await new Promise((ok,bad)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';x.onload=ok;x.onerror=bad;document.head.appendChild(x)});html=new TextDecoder().decode(self.pako.ungzip(bytes))}document.open();document.write(html);document.close()}catch(e){console.error(e);status.textContent='The generator could not load. Refresh once in Safari. '+e.message}})();
</script></body></html>
